    <section id="camera-section">
        <div id="camera-widget">
            <div class="widget-front" id="widget-greeting">
                <!-- <img src="../Media/Light Oak Framed Whiteboard Cutout.png"> -->
                <p>Wherever you go, we're right with you.</p>
                <button  id ='camera-button' onclick="startCamera()">Begin Camera Feed</button>
            </div>
            <div class="widget-back hidden" id="widget-video">
                <video class = "fit-to-width" id="webcam" autoplay playsinline></video>
                <!-- [AI-FIX] id was a duplicate of the Begin Camera Feed button; each id must be unique -->
                <button id="end-feed-button" type="button">End Feed</button>
                <!-- [AI] panels shown by reminders.js (they live inside the widget so they travel with it) -->
                <div id="countdown-panel" class="hidden">
                    <p>Look 20 feet away</p>
                    <p id="countdown-number">20</p>
                    <p>seconds</p>
                </div>
                <div id="question-panel" class="hidden">
                    <p id="question-text"></p>
                    <input id="question-input" type="text" maxlength="200" placeholder="Type your answer..." aria-label="Your answer">
                    <div id="question-actions">
                        <button id="question-send" type="button">Send</button>
                        <button id="question-skip" type="button">Skip</button>
                    </div>
                </div>
            </div>
        </div>
        <button id="launch-widget" onclick="launchWidget()">
        Launch Mirror Widget
        </button>
        <!-- [AI] try the reminder and question without waiting 10-20 minutes -->
        <div id="preview-buttons">
            <button type="button" onclick="kairnDemo.reminder()">Preview Reminder</button>
            <button type="button" onclick="kairnDemo.question()">Preview Check-in Question</button>
        </div>
    </section>
